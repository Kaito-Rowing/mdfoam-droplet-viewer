<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title description">
  <title id="title">mdFOAM Droplet Viewer</title>
  <desc id="description">Your simulations. Your models. Droplet analysis through a browser, a JSON CLI and MCP. An illustrative droplet and comparison curves appear on the right.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0b1822"/>
      <stop offset="1" stop-color="#142d37"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#99f5db" stop-opacity=".85"/>
      <stop offset="1" stop-color="#40b99e" stop-opacity=".08"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a6dacb" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1280" height="380" rx="20" fill="url(#background)"/>
  <rect x="720" width="560" height="380" rx="20" fill="url(#grid)"/>
  <path d="M20 379H1260" stroke="#62d8b8" stroke-opacity=".35"/>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <g transform="translate(54 44)">
      <path d="M13 0C7 7 0 15 0 22a13 13 0 0 0 26 0C26 15 19 7 13 0Z" fill="#73e2c2"/>
      <text x="42" y="25" fill="#d6e9ee" font-size="23" font-weight="650">mdFOAM Droplet Viewer</text>
    </g>
    <text x="54" y="141" fill="#f2f8fa" font-size="52" font-weight="700" letter-spacing="-1.8">Your simulations.</text>
    <text x="54" y="202" fill="#82e9ca" font-size="52" font-weight="700" letter-spacing="-1.8">Your models.</text>
    <text x="57" y="245" fill="#a6bdc9" font-size="19">Inspect droplets. Compare runs. Extend the science.</text>
    <g transform="translate(56 285)" font-size="13" font-weight="600" letter-spacing="1">
      <rect width="114" height="36" rx="18" fill="#193c42" stroke="#35625f"/>
      <text x="57" y="23" text-anchor="middle" fill="#94e8d0">BROWSER</text>
      <rect x="126" width="114" height="36" rx="18" fill="#172e3e" stroke="#35516b"/>
      <text x="183" y="23" text-anchor="middle" fill="#a6c8f8">JSON CLI</text>
      <rect x="252" width="114" height="36" rx="18" fill="#302d3e" stroke="#5e506c"/>
      <text x="309" y="23" text-anchor="middle" fill="#d8bdf1">MCP</text>
    </g>
    <g transform="translate(810 50)">
      <rect width="400" height="262" rx="14" fill="#0d202a" stroke="#34515c"/>
      <circle cx="20" cy="19" r="3" fill="#67ddbc"/>
      <text x="32" y="23" fill="#b5ced8" font-size="11" letter-spacing="1.7">OBSERVE / MODEL / COMPARE</text>
      <path d="M28 143H372" stroke="#385663" stroke-width="2"/>
      <path d="M102 143A98 98 0 0 1 298 143Z" fill="url(#liquid)" stroke="#80e9c8" stroke-width="2"/>
      <path d="M147 102C159 80 180 66 204 62" fill="none" stroke="#d5fff1" stroke-width="3" stroke-linecap="round" opacity=".6"/>
      <path d="M200 51V144" stroke="#669b9b" stroke-dasharray="4 5"/>
      <path d="M30 239H370M30 168V239" fill="none" stroke="#385663"/>
      <path d="M42 176C105 178 124 190 177 208S278 230 356 232" fill="none" stroke="#83e4c5" stroke-width="2.5"/>
      <path d="M42 187C104 188 154 205 201 216S302 231 356 234" fill="none" stroke="#d9b37b" stroke-width="2" stroke-dasharray="5 5"/>
      <g fill="#83e4c5">
        <circle cx="42" cy="176" r="3"/><circle cx="99" cy="182" r="3"/>
        <circle cx="155" cy="200" r="3"/><circle cx="213" cy="218" r="3"/>
        <circle cx="274" cy="228" r="3"/><circle cx="356" cy="232" r="3"/>
      </g>
    </g>
    <text x="1010" y="341" fill="#7899a9" font-size="11" letter-spacing="2" text-anchor="middle">LOCAL ANALYSIS. OPEN POSSIBILITIES.</text>
  </g>
</svg>
