[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdfoam-example-model"
version = "0.1.0"
description = "Minimal installed Python model extension for mdFOAM Droplet Viewer"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = "MIT"

[project.entry-points."mdfoam_droplet_viewer.models"]
example-linear = "demo_model"

[tool.setuptools]
py-modules = ["demo_model"]
